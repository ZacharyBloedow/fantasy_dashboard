<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Available Players</title>
    <link
      href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <style>
      /* Optional: extra styling for the button */
      #backButton {
        position: absolute;
        top: 20px;
        right: 20px;
        padding: 8px 12px;
        background: #007bff;
        color: white;
        border-radius: 5px;
        text-decoration: none;
      }

      .filter-container {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div
      style="
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
      "
    >
      <a href="index.html" class="button">
        <span class="text">Keepers</span>
      </a>
      <a href="available_picks.html" class="button">
        <span class="text">Available Picks</span>
      </a>
    </div>

    <div class="filter-container">
      <select id="teamFilter">
        <option value="">All Teams</option>
      </select>

      <select id="positionFilter">
        <option value="">All Positions</option>
      </select>
    </div>

    <div id="players-table"></div>

    <script src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    <script>
      let playersData = [];

      fetch("data/available_players.json")
        .then((res) => res.json())
        .then((data) => {
          playersData = data;

          // Populate filter dropdowns
          const teamSet = [...new Set(playersData.map((p) => p.team))].sort();
          const positionSet = [
            ...new Set(playersData.map((p) => p.position)),
          ].sort();

          const teamFilter = document.getElementById("teamFilter");
          const positionFilter = document.getElementById("positionFilter");

          teamSet.forEach((team) => teamFilter.add(new Option(team, team)));
          positionSet.forEach((pos) =>
            positionFilter.add(new Option(pos, pos))
          );

          // Initialize Tabulator table
          const table = new Tabulator("#players-table", {
            data: playersData,
            layout: "fitColumns",
            pagination: "local",
            paginationSize: 400,
            columns: [
              { title: "Player", field: "player", sorter: "string" },
              { title: "Team", field: "team", sorter: "string" },
              { title: "Position", field: "position", sorter: "string" },
            ],
          });

          // Filter function
          function applyFilters() {
            const selectedTeam = teamFilter.value;
            const selectedPosition = positionFilter.value;

            table.setFilter(
              [
                selectedTeam
                  ? { field: "team", type: "=", value: selectedTeam }
                  : null,
                selectedPosition
                  ? { field: "position", type: "=", value: selectedPosition }
                  : null,
              ].filter(Boolean)
            );
          }

          teamFilter.addEventListener("change", applyFilters);
          positionFilter.addEventListener("change", applyFilters);
        })
        .catch((err) => console.error("Failed to load JSON:", err));
    </script>
  </body>
</html>
