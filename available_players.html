<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Available Players</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 10px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
      select {
        margin-right: 10px;
      }
      #filters {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Available Players</h1>

    <div id="filters">
      <label for="teamFilter">Team:</label>
      <select id="teamFilter">
        <option value="">All</option>
      </select>

      <label for="positionFilter">Position:</label>
      <select id="positionFilter">
        <option value="">All</option>
      </select>
    </div>

    <table id="playersTable">
      <thead>
        <tr>
          <th>Player</th>
          <th>Team</th>
          <th>Position</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script>
      let playersData = [];

      fetch("data/available_players.json")
        .then((res) => res.json())
        .then((data) => {
          playersData = data;
          populateFilters();
          renderTable(playersData);
        })
        .catch((err) => console.error(err));

      function populateFilters() {
        const teams = [...new Set(playersData.map((p) => p.team))];
        const positions = [...new Set(playersData.map((p) => p.position))];

        const teamFilter = document.getElementById("teamFilter");
        const positionFilter = document.getElementById("positionFilter");

        teams.forEach((t) => teamFilter.add(new Option(t, t)));
        positions.forEach((p) => positionFilter.add(new Option(p, p)));

        teamFilter.addEventListener("change", filterPlayers);
        positionFilter.addEventListener("change", filterPlayers);
      }

      function filterPlayers() {
        const selectedTeam = document.getElementById("teamFilter").value;
        const selectedPosition =
          document.getElementById("positionFilter").value;

        const filtered = playersData.filter(
          (p) =>
            (!selectedTeam || p.team === selectedTeam) &&
            (!selectedPosition || p.position === selectedPosition)
        );

        renderTable(filtered);
      }

      function renderTable(data) {
        const tbody = document.querySelector("#playersTable tbody");
        tbody.innerHTML = "";
        data.forEach((p) => {
          const row = document.createElement("tr");
          row.innerHTML = `<td>${p.player}</td><td>${p.team}</td><td>${p.position}</td>`;
          tbody.appendChild(row);
        });
      }
    </script>
  </body>
</html>
