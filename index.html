<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fantasy Football Dashboard</title>
    <link
      href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <h1>Fantasy Football Keepers Dashboard</h1>

    <div class="filters">
      <input type="text" id="search" placeholder="Global search..." />
      <select id="position">
        <option value="">All Positions</option>
      </select>
      <select id="nfl_team">
        <option value="">All NFL Teams</option>
      </select>
      <select id="fantasy_team">
        <option value="">All Fantasy Teams</option>
      </select>
    </div>

    <div id="table"></div>

    <script src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
