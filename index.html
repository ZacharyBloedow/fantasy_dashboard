<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fantasy Keepers Dashboard</title>
    <!-- Tabulator CSS -->
    <link
      href="https://unpkg.com/tabulator-tables@5.5.1/dist/css/tabulator.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      h1 {
        text-align: center;
      }
      #keepers-table {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Fantasy Keepers Dashboard</h1>
    <div id="keepers-table"></div>

    <!-- Tabulator JS -->
    <script src="https://unpkg.com/tabulator-tables@5.5.1/dist/js/tabulator.min.js"></script>
    <script>
      // Create the table
      const table = new Tabulator("#keepers-table", {
        layout: "fitColumns",
        pagination: "local",
        paginationSize: 25,
        placeholder: "Loading data...",
        columns: [
          { title: "Player", field: "name", sorter: "string" },
          { title: "Position", field: "category", sorter: "string" },
          { title: "NFL Team", field: "status", sorter: "string" },
          { title: "Fantasy Team", field: "fantasy_team", sorter: "string" },
          { title: "Keeper Round", field: "keeper_round", sorter: "number" },
          { title: "Overall Pick", field: "value", sorter: "number" },
        ],
      });

      // Load data.json
      fetch("data/data.json")
        .then((response) => {
          if (!response.ok) throw new Error("Failed to fetch data.json");
          return response.json();
        })
        .then((data) => {
          table.setData(data);
        })
        .catch((err) => {
          console.error(err);
          table.replaceData([]); // show empty table
        });
    </script>
  </body>
</html>
