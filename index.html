<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fantasy Dashboard</title>
    <link
      href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <h1>2025 Keepers</h1>

    <div class="filter-container">
      <select id="positionFilter">
        <option value="">All Positions</option>
      </select>

      <select id="nflTeamFilter">
        <option value="">All NFL Teams</option>
      </select>

      <select id="fantasyTeamFilter">
        <option value="">All Fantasy Teams</option>
      </select>

      <select id="keeperRoundFilter">
        <option value="">All Keeper Rounds</option>
      </select>
    </div>

    <div id="fantasy-table"></div>

    <script src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    <script>
      fetch("data/data.json")
        .then((response) => response.json())
        .then((data) => {
          // --- Populate dropdowns ---
          const positions = Array.from(
            new Set(data.map((d) => d.category))
          ).sort();
          const nflTeams = Array.from(
            new Set(data.map((d) => d.status))
          ).sort();
          const fantasyTeams = Array.from(
            new Set(data.map((d) => d.fantasy_team))
          ).sort();

          const positionSelect = document.getElementById("positionFilter");
          positions.forEach((pos) => {
            const opt = document.createElement("option");
            opt.value = pos;
            opt.textContent = pos;
            positionSelect.appendChild(opt);
          });

          const nflSelect = document.getElementById("nflTeamFilter");
          nflTeams.forEach((team) => {
            const opt = document.createElement("option");
            opt.value = team;
            opt.textContent = team;
            nflSelect.appendChild(opt);
          });

          const fantasySelect = document.getElementById("fantasyTeamFilter");
          fantasyTeams.forEach((team) => {
            const opt = document.createElement("option");
            opt.value = team;
            opt.textContent = team;
            fantasySelect.appendChild(opt);
          });

          const keeperSelect = document.getElementById("keeperRoundFilter");
          for (let i = 1; i <= 15; i++) {
            const opt = document.createElement("option");
            opt.value = i;
            opt.textContent = i;
            keeperSelect.appendChild(opt);
          }

          // --- Initialize Tabulator ---
          const table = new Tabulator("#fantasy-table", {
            data: data,
            layout: "fitColumns",
            columns: [
              { title: "Player", field: "name", headerFilter: false },
              { title: "Position", field: "category" },
              { title: "NFL Team", field: "status" },
              { title: "Fantasy Team", field: "fantasy_team" },
              { title: "Keeper Round", field: "keeper_round" },
              { title: "Keeper Pick", field: "keeper_pick" },
              { title: "ADP", field: "ADP", sorter: "number" },
            ],
            initialSort: [{ column: "value", dir: "asc" }],
          });

          // --- Filter functions ---
          function applyFilters() {
            const pos = positionSelect.value;
            const nfl = nflSelect.value;
            const fantasy = fantasySelect.value;
            const round = keeperSelect.value;

            table.setFilter(
              [
                pos ? { field: "category", type: "=", value: pos } : null,
                nfl ? { field: "status", type: "=", value: nfl } : null,
                fantasy
                  ? { field: "fantasy_team", type: "=", value: fantasy }
                  : null,
                round
                  ? { field: "keeper_round", type: "=", value: parseInt(round) }
                  : null,
              ].filter(Boolean)
            );
          }

          positionSelect.addEventListener("change", applyFilters);
          nflSelect.addEventListener("change", applyFilters);
          fantasySelect.addEventListener("change", applyFilters);
          keeperSelect.addEventListener("change", applyFilters);
        })
        .catch((err) => console.error("Failed to load JSON:", err));
    </script>
  </body>
</html>
