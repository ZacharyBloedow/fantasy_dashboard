<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fantasy Dashboard</title>
    <link
      href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <a
      href="available_players.html"
      style="
        position: absolute;
        top: 20px;
        right: 20px;
        padding: 8px 12px;
        background: #007bff;
        color: white;
        border-radius: 5px;
        text-decoration: none;
      "
    >
      Available Players
    </a>

    <h1>2025 Keepers</h1>

    <div class="filter-container">
      <select id="positionFilter">
        <option value="">All Positions</option>
      </select>
      <select id="nflTeamFilter">
        <option value="">All NFL Teams</option>
      </select>
      <select id="fantasyTeamFilter">
        <option value="">All Fantasy Teams</option>
      </select>
      <select id="keeperRoundFilter">
        <option value="">All Keeper Rounds</option>
      </select>
    </div>

    <div id="fantasy-table"></div>

    <script src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    <script>
      fetch("data/data.json")
        .then((res) => res.json())
        .then((data) => {
          // Populate dropdowns
          const positions = [...new Set(data.map((d) => d.category))].sort();
          const teams = [...new Set(data.map((d) => d.status))].sort();
          const fantasyTeams = [
            ...new Set(data.map((d) => d.fantasy_team)),
          ].sort();

          const positionSelect = document.getElementById("positionFilter");
          positions.forEach((p) => positionSelect.add(new Option(p, p)));

          const nflSelect = document.getElementById("nflTeamFilter");
          teams.forEach((t) => nflSelect.add(new Option(t, t)));

          const fantasySelect = document.getElementById("fantasyTeamFilter");
          fantasyTeams.forEach((t) => fantasySelect.add(new Option(t, t)));

          const keeperSelect = document.getElementById("keeperRoundFilter");
          for (let i = 1; i <= 15; i++) keeperSelect.add(new Option(i, i));

          // Initialize table
          const table = new Tabulator("#fantasy-table", {
            data,
            layout: "fitColumns",
            columns: [
              { title: "Player", field: "name" },
              { title: "Position", field: "category" },
              { title: "NFL Team", field: "status" },
              { title: "Fantasy Team", field: "fantasy_team" },
              { title: "Keeper Round", field: "keeper_round" },
              { title: "Keeper Pick", field: "keeper_pick" },
              { title: "ADP", field: "ADP", sorter: "number" },
            ],
          });

          function applyFilters() {
            table.setFilter(
              [
                positionSelect.value
                  ? {
                      field: "category",
                      type: "=",
                      value: positionSelect.value,
                    }
                  : null,
                nflSelect.value
                  ? { field: "status", type: "=", value: nflSelect.value }
                  : null,
                fantasySelect.value
                  ? {
                      field: "fantasy_team",
                      type: "=",
                      value: fantasySelect.value,
                    }
                  : null,
                keeperSelect.value
                  ? {
                      field: "keeper_round",
                      type: "=",
                      value: parseInt(keeperSelect.value),
                    }
                  : null,
              ].filter(Boolean)
            );
          }

          positionSelect.addEventListener("change", applyFilters);
          nflSelect.addEventListener("change", applyFilters);
          fantasySelect.addEventListener("change", applyFilters);
          keeperSelect.addEventListener("change", applyFilters);
        })
        .catch((err) => console.error(err));
    </script>
  </body>
</html>
