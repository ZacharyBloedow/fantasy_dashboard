<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fantasy Dashboard</title>
    <link
      href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      #fantasy-table {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Fantasy Dashboard</h1>
    <div id="fantasy-table"></div>

    <script src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    <script>
      // Create Tabulator table
      let table = new Tabulator("#fantasy-table", {
        layout: "fitColumns",
        placeholder: "No data available",
        columns: [
          { title: "Player", field: "name", headerFilter: "input" },
          {
            title: "Position",
            field: "category",
            headerFilter: "select",
            headerFilterParams: { values: true },
          },
          {
            title: "NFL Team",
            field: "status",
            headerFilter: "select",
            headerFilterParams: { values: true },
          },
          {
            title: "Fantasy Team",
            field: "fantasy_team",
            headerFilter: "select",
            headerFilterParams: { values: true },
          },
          {
            title: "Keeper Round",
            field: "keeper_round",
            headerFilter: "select",
            headerFilterParams: { values: true },
          },
          { title: "Keeper Pick", field: "keeper_pick" },
          { title: "Overall Pick", field: "value" },
        ],
      });

      // Fetch JSON data from the data folder
      fetch("data/data.json")
        .then((response) => {
          if (!response.ok)
            throw new Error(`HTTP error! status: ${response.status}`);
          return response.json();
        })
        .then((data) => table.setData(data))
        .catch((err) => console.error("Failed to fetch data.json:", err));
    </script>
  </body>
</html>
